<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LoveBox Photobooth</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="hero">
        <div class="heart">♡</div>

        <h1>LoveBox</h1>

        <p>Make a little memory together ✨</p>
    </header>


    <!-- SETTINGS -->

    <section class="panel">

        <h2>🎀 Customize</h2>

        <div class="form-grid">

            <div class="field">
                <label>Nama kamu</label>
                <input id="name1" type="text" placeholder="Contoh: Syahid">
            </div>

            <div class="field">
                <label>Nama dia</label>
                <input id="name2" type="text" placeholder="Contoh: Napis">
            </div>

            <div class="field">
                <label>Judul</label>
                <input id="title" type="text" value="Our Little Moments">
            </div>

            <div class="field">
                <label>Tanggal</label>
                <input id="date" type="date">
            </div>

            <div class="field full">
                <label>Pesan</label>
                <input
                    id="message"
                    type="text"
                    value="Every moment with you is special ♡">
            </div>

        </div>


        <div class="settings-grid">

            <div class="field">
                <label>Layout</label>

                <select id="layout">

                    <option value="1x1">1 × 1 — 1 foto</option>
                    <option value="2x1">2 × 1 — 2 foto</option>
                    <option value="2x2">2 × 2 — 4 foto</option>
                    <option value="3x2">3 × 2 — 6 foto</option>
                    <option value="3x3">3 × 3 — 9 foto</option>
                    <option value="4x2">4 × 2 — 8 foto</option>
                    <option value="4x3">4 × 3 — 12 foto</option>
                    <option value="4x4">4 × 4 — 16 foto</option>
                    <option value="5x2">5 × 2 — 10 foto</option>
                    <option value="5x3">5 × 3 — 15 foto</option>
                    <option value="6x2">6 × 2 — 12 foto</option>
                    <option value="6x3">6 × 3 — 18 foto</option>

                </select>
            </div>


            <div class="field">
                <label>Frame</label>

                <select id="frame">

                    <option value="pink">💗 Pink Love</option>
                    <option value="white">🤍 Clean White</option>
                    <option value="purple">💜 Purple Dream</option>
                    <option value="blue">💙 Baby Blue</option>
                    <option value="red">❤️ Red Love</option>
                    <option value="black">🖤 Elegant Black</option>

                </select>
            </div>


            <div class="field">
                <label>Filter</label>

                <select id="filter">

                    <option value="normal">✨ Normal</option>
                    <option value="soft">🌸 Soft</option>
                    <option value="vintage">🤎 Vintage</option>
                    <option value="bw">🖤 B&W</option>
                    <option value="vivid">💫 Vivid</option>

                </select>
            </div>

        </div>

    </section>


    <!-- CAMERA -->

    <section class="panel">

        <h2>📸 Camera</h2>

        <div class="camera-box">

            <video
                id="video"
                autoplay
                muted
                playsinline>
            </video>

            <div class="camera-overlay">

                <span id="cameraStatus">
                    Camera belum aktif
                </span>

            </div>

            <div id="flash"></div>

        </div>


        <div class="camera-actions">

            <button
                id="cameraButton"
                class="button primary">

                📷 Aktifkan Kamera

            </button>

            <button
                id="startButton"
                class="button capture"
                disabled>

                💗 Mulai Photobox

            </button>

        </div>


        <p id="status" class="status">
            Izinkan akses kamera untuk memulai.
        </p>

    </section>


    <!-- COUNTDOWN -->

    <div id="countdown" class="countdown">

        <div id="countdownNumber">3</div>

    </div>


    <!-- RESULT -->

    <section
        id="resultSection"
        class="result-section">

        <h2>✨ Your Memory ✨</h2>

        <div
            id="resultFrame"
            class="result-frame pink">


            <div class="result-top">

                <h3 id="resultTitle">
                    Our Little Moments
                </h3>

                <p id="resultNames">
                    You × Me
                </p>

            </div>


            <div
                id="resultGrid"
                class="result-grid">
            </div>


            <div class="result-bottom">

                <p id="resultMessage">
                    Every moment with you is special ♡
                </p>

                <small id="resultDate"></small>

            </div>

        </div>


        <div class="result-actions">

            <button
                id="downloadButton"
                class="button download">

                💾 Simpan JPG

            </button>

            <button
                id="retakeButton"
                class="button secondary">

                📸 Foto Lagi

            </button>

        </div>

    </section>


    <footer>
        Made with ♡
    </footer>

</div>


<script src="script.js"></script>

</body>
</html>
