<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Our Little Photobox 💗</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>


<body>

<div class="app">


    <!-- HEADER -->

    <header>

        <div class="logo">
            ♡
        </div>

        <h1>
            Our Little Photobox
        </h1>

        <p>
            Capture your little moments ✨
        </p>

    </header>



    <!-- CUSTOMIZE -->

    <section class="card">

        <h2>
            🎀 Customize
        </h2>


        <div class="form-grid">


            <div class="input-group">

                <label>
                    Nama 1
                </label>

                <input
                    id="name1"
                    type="text"
                    placeholder="Nama kamu">

            </div>


            <div class="input-group">

                <label>
                    Nama 2
                </label>

                <input
                    id="name2"
                    type="text"
                    placeholder="Nama dia">

            </div>


            <div class="input-group">

                <label>
                    Judul
                </label>

                <input
                    id="title"
                    type="text"
                    value="Our Little Moments">

            </div>


            <div class="input-group">

                <label>
                    Tanggal
                </label>

                <input
                    id="date"
                    type="date">

            </div>


            <div class="input-group full">

                <label>
                    Pesan
                </label>

                <input
                    id="message"
                    type="text"
                    value="A little moment with you ❤️">

            </div>

        </div>



        <!-- OPTIONS -->

        <div class="options">


            <div>

                <label>
                    Layout Foto
                </label>

                <select id="layout">

                    <option value="1x1">
                        1 × 1 — 1 Foto
                    </option>

                    <option value="2x1">
                        2 × 1 — 2 Foto
                    </option>

                    <option value="2x2">
                        2 × 2 — 4 Foto
                    </option>

                    <option value="3x2">
                        3 × 2 — 6 Foto
                    </option>

                    <option value="3x3">
                        3 × 3 — 9 Foto
                    </option>

                    <option value="4x2">
                        4 × 2 — 8 Foto
                    </option>

                    <option value="4x3">
                        4 × 3 — 12 Foto
                    </option>

                    <option value="4x4">
                        4 × 4 — 16 Foto
                    </option>

                    <option value="5x2">
                        5 × 2 — 10 Foto
                    </option>

                    <option value="5x3">
                        5 × 3 — 15 Foto
                    </option>

                    <option value="6x2">
                        6 × 2 — 12 Foto
                    </option>

                    <option value="6x3">
                        6 × 3 — 18 Foto
                    </option>

                </select>

            </div>



            <div>

                <label>
                    Frame
                </label>

                <select id="frame">

                    <option value="pink">
                        💗 Pink Love
                    </option>

                    <option value="white">
                        🤍 Clean White
                    </option>

                    <option value="purple">
                        💜 Purple Dream
                    </option>

                    <option value="black">
                        🖤 Elegant Black
                    </option>

                    <option value="blue">
                        💙 Baby Blue
                    </option>

                    <option value="red">
                        ❤️ Red Love
                    </option>

                </select>

            </div>



            <div>

                <label>
                    Filter
                </label>

                <select id="filter">

                    <option value="none">
                        ✨ Normal
                    </option>

                    <option value="soft">
                        🌸 Soft
                    </option>

                    <option value="vintage">
                        🤎 Vintage
                    </option>

                    <option value="bw">
                        🖤 B&W
                    </option>

                    <option value="vivid">
                        💫 Vivid
                    </option>

                </select>

            </div>

        </div>

    </section>



    <!-- CAMERA -->

    <section class="card">


        <div class="camera-container">

            <video
                id="video"
                autoplay
                playsinline>
            </video>

            <div id="flash"></div>

            <div class="camera-label">
                CAMERA
            </div>

        </div>



        <div class="buttons">

            <button
                id="startCamera"
                class="btn primary">

                📷 Start Camera

            </button>


            <button
                id="startPhotobox"
                class="btn capture">

                💗 Start Photobox

            </button>


            <button
                id="reset"
                class="btn secondary">

                ↻ Reset

            </button>

        </div>


        <div id="status">

            Isi data lalu nyalakan kamera ✨

        </div>

    </section>



    <!-- COUNTDOWN -->

    <div
        id="countdown"
        class="countdown">

        <span>
            3
        </span>

    </div>



    <!-- RESULT -->

    <section
        id="result"
        class="result">

        <h2>
            ✨ Your Photobox ✨
        </h2>


        <div
            id="photoFrame"
            class="photo-frame pink">


            <div class="decoration top">
                ♥
            </div>


            <div class="result-header">

                <h3 id="resultTitle">
                    Our Little Moments
                </h3>

                <p id="resultNames">
                    Nama 1 × Nama 2
                </p>

            </div>


            <div
                id="photoGrid"
                class="photo-grid">
            </div>


            <div class="result-footer">

                <p id="resultMessage">
                    A little moment with you ❤️
                </p>

                <small id="resultDate">
                    28 • 08 • 2026
                </small>

            </div>


            <div class="decoration bottom">
                ♥
            </div>

        </div>



        <div class="result-buttons">

            <button
                id="download"
                class="btn download">

                💾 Download

            </button>


            <button
                id="retake"
                class="btn secondary">

                📸 Take Again

            </button>

        </div>

    </section>



    <footer>
        Made with ♡ for someone special
    </footer>


</div>


<script src="script.js"></script>

</body>

</html>
